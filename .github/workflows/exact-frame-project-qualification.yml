name: Exact frame project qualification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/exact-frame-project-qualification.yml"
      - "docker/**"
      - "docker-compose.yml"
      - "iopaint/project_store.py"
      - "iopaint/frame_edit_api.py"
      - "iopaint/frame_media.py"
      - "iopaint/tests/**"
      - "web_app/src/**"
      - "web_app/tests/**"
      - "web_app/package*.json"
  pull_request:
    paths:
      - ".github/workflows/exact-frame-project-qualification.yml"
      - "docker/**"
      - "docker-compose.yml"
      - "iopaint/project_store.py"
      - "iopaint/frame_edit_api.py"
      - "iopaint/frame_media.py"
      - "iopaint/tests/**"
      - "web_app/src/**"
      - "web_app/tests/**"
      - "web_app/package*.json"

jobs:
  native-project-workflow:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web_app/package-lock.json
      - name: Install exact-frame test dependencies
        run: python -m pip install pytest pytest-github-actions-annotate-failures fastapi python-multipart httpx pillow numpy
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress -y
          $ffmpeg = Get-ChildItem C:\ProgramData\chocolatey\lib\ffmpeg\tools -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $ffmpeg) { throw "Chocolatey installed FFmpeg without an ffmpeg.exe tool" }
          $ffmpeg.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify FFmpeg availability
        run: ffmpeg -version
      - name: Qualify project workflow and real-media corpus
        run: python -m pytest iopaint/tests/test_project_store.py iopaint/tests/test_project_workflow_portability.py iopaint/tests/test_frame_edit_api.py iopaint/tests/test_frame_media.py iopaint/tests/test_frame_media_real.py -q
      - name: Install browser workflow dependencies
        working-directory: web_app
        run: npm ci
      - name: Install Chromium
        working-directory: web_app
        run: npx playwright install chromium
      - name: Run approved browser workflow
        working-directory: web_app
        env:
          FRAME_EDIT_E2E_BASE_URL: http://127.0.0.1:8088
          FRAME_EDIT_E2E_START_SERVER: "1"
        run: npx playwright test tests/frame-editing.spec.mjs --config playwright.config.mjs
